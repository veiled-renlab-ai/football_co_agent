  <script>
    function academyApp() {
      return {
        runs: [],
        selectedRunId: null,
        runDetail: null,
        selectedEpisodeIdx: null,
        liveFeed: [],
        liveCount: 0,
        skillChart: null,
        perAgentRows: [],
        ws: null,
        newRunModalOpen: false,
        creating: false,
        newRun: {
          n_episodes: 1,
          scenario: 'llm_11v11_full',
          max_decisions_total: 100000,
          max_wall_seconds: 5400.0,
          obs_refresh_every_ticks: 25,
          target_wall_fps: 50.0,
          tick_stream_every_ticks: 5,
          frame_stream_every_ticks: 3,
          render: true,
          stop_world_mode: false,
          stop_world_timeout: 8.0,
        },
        // Per-slot soul textareas. Loaded by loadLineupTemplate() when modal opens.
        // Each entry: {slot, team, name, jersey, position, default, fifa_player, fifa, soul}.
        lineupEntries: [],
        lineupExpanded: false,
        lineupLoading: false,
        lastTick: null,
        stopping: false,
        viewMode: 'three',
        threeCam: 'broadcast',
        videoError: false,
        kickoffWait: null,
        agentLabels: {},  // slot → full label string, populated from 'starting' status event
        get videoStreamUrl() {
          // Append a cache-bust so re-selecting a run reconnects the stream.
          return this.selectedRunId
            ? `/stream/${this.selectedRunId}?t=${this.selectedRunId}`
            : '';
        },
        pollHandle: null,

        async boot() {
          await this.refreshRuns();
          this.pollHandle = setInterval(() => this.refreshRuns(), 4000);
          this.$watch('viewMode', (val) => {
            if (val === 'three') {
              this.$nextTick(() => {
                const c = document.getElementById('three-canvas');
                if (c) { ThreeViewer.init(c); ThreeViewer.updateFromTick(this.lastTick); }
              });
            }
          });
          // $watch doesn't fire on initial value — kick off three init if it's the default mode.
          this.$nextTick(() => {
            if (this.viewMode === 'three') {
              const c = document.getElementById('three-canvas');
              if (c) ThreeViewer.init(c);
            }
          });
        },

        threeSetCamera(preset) {
          this.threeCam = preset;
          ThreeViewer.setCameraPreset(preset);
        },

        async refreshRuns() {
          try {
            const r = await fetch('/api/runs');
            this.runs = await r.json();
            // Auto-refresh detail if currently selected
            if (this.selectedRunId && this.runDetail && this.runDetail.status === 'running') {
              await this.loadRunDetail(this.selectedRunId, /*keepFeed*/ true);
            }
          } catch (e) { console.error(e); }
        },

        async selectRun(runId) {
          this.selectedRunId = runId;
          this.liveFeed = [];
          this.liveCount = 0;
          this.lastTick = null;
          this.stopping = false;
          this.videoError = false;
          this.kickoffWait = null;
          this.agentLabels = {};
          // Default view: 3D when this run actually rendered; 2D otherwise.
          this.selectedEpisodeIdx = null;
          await this.loadRunDetail(runId);
          this.viewMode = 'three';
          this.threeCam = 'broadcast';
          this.openWs(runId);
        },

        async stopRun() {
          if (!this.selectedRunId) return;
          this.stopping = true;
          try {
            await fetch(`/api/runs/${this.selectedRunId}/stop`, {method: 'POST'});
          } catch (e) {
            console.error(e);
          }
          // status flips to 'completed' via run_end event; reset stopping there
        },

        formatGameClock(envTick) {
          // gfootball: pps=2 → 1 env tick = 0.02 game-sec (50 ticks/sec game time)
          const sec = envTick / 50;
          const m = Math.floor(sec / 60);
          const s = Math.floor(sec % 60);
          return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        },

        async loadRunDetail(runId, keepFeed = false) {
          const r = await fetch(`/api/runs/${runId}`);
          if (!r.ok) return;
          this.runDetail = await r.json();
          // Use latest episode for charts (or keep current selection if loaded explicitly)
          const eps = this.runDetail.episodes ?? [];
          if (eps.length > 0 && !this.selectedEpisodeIdx) {
            await this.renderEpisode(eps[eps.length - 1]);
          }
        },

        async loadEpisode(epIdx) {
          this.selectedEpisodeIdx = epIdx;
          // Find summary in meta
          const ep = (this.runDetail.episodes ?? []).find(e => e.ep_index === epIdx);
          if (ep) await this.renderEpisode(ep);
        },

        async renderEpisode(ep) {
          const summary = ep.summary;
          this.perAgentRows = summary.per_agent ?? [];
          // Wait for Alpine to render the canvas template before drawing.
          await this.$nextTick();
          this.drawSkillChart(summary.skill_distribution ?? {});
        },

        drawSkillChart(dist) {
          const labels = Object.keys(dist);
          const data = Object.values(dist);
          const ctx = document.getElementById('skillChart');
          if (!ctx) {
            // Canvas not in DOM yet — try once more after a paint.
            requestAnimationFrame(() => {
              const c2 = document.getElementById('skillChart');
              if (c2) this._drawSkillChartOn(c2, labels, data);
            });
            return;
          }
          this._drawSkillChartOn(ctx, labels, data);
        },

        _drawSkillChartOn(ctx, labels, data) {
          if (this.skillChart) this.skillChart.destroy();
          this.skillChart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                data,
                backgroundColor: '#818cf8',
                borderRadius: 4,
                borderSkipped: false,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: {
                  ticks: { color: '#a1a1aa', font: { family: 'JetBrains Mono', size: 11 } },
                  grid: { display: false },
                },
                y: {
                  ticks: { color: '#71717a', font: { family: 'JetBrains Mono', size: 11 }, beginAtZero: true },
                  grid: { color: '#27272a' },
                }
              }
            }
          });
        },

        openWs(runId) {
          if (this.ws) { try { this.ws.close(); } catch (_) {} }
          const proto = location.protocol === 'https:' ? 'wss' : 'ws';
          const url = `${proto}://${location.host}/ws/runs/${runId}`;
          this.ws = new WebSocket(url);
          this.ws.onmessage = (msg) => {
            const evt = JSON.parse(msg.data);
            this.handleEvent(evt);
          };
          this.ws.onclose = () => { /* server killed it; will reopen on selectRun */ };
        },

        handleEvent(evt) {
          if (evt.type === 'decision') {
            this.liveFeed.push(evt);
            if (this.liveFeed.length > 200) this.liveFeed = this.liveFeed.slice(-200);
            this.liveCount += 1;
          } else if (evt.type === 'tick') {
            this.lastTick = evt;
            if (this.viewMode === 'three') ThreeViewer.updateFromTick(evt);
          } else if (evt.type === 'status') {
            // Runner phase events. Two phases drive the kickoff banner:
            //   "waiting_for_kickoff" → show "等待 N 个 LLM 准备开球..."
            //   "kickoff"             → hide banner; env starts ticking now
            if (evt.phase === 'starting' && evt.agents) {
              const m = {};
              evt.agents.forEach(a => { m[a.slot] = a.label; });
              this.agentLabels = m;
            } else if (evt.phase === 'waiting_for_kickoff') {
              this.kickoffWait = {
                ready: evt.ready ?? 0,
                total: evt.total ?? 0,
                timeout_seconds: evt.timeout_seconds ?? null,
              };
            } else if (evt.phase === 'kickoff') {
              this.kickoffWait = null;
            }
          } else if (evt.type === 'episode_start') {
            this.lastTick = null;
            this.kickoffWait = null;
          } else if (evt.type === 'run_end') {
            this.stopping = false;
            this.kickoffWait = null;
            this.refreshRuns();
            if (this.selectedRunId) this.loadRunDetail(this.selectedRunId);
          } else if (evt.type === 'episode_end') {
            this.kickoffWait = null;
            this.refreshRuns();
            if (this.selectedRunId) this.loadRunDetail(this.selectedRunId);
          } else if (evt.type === 'run_started') {
            this.refreshRuns();
            if (this.selectedRunId) this.loadRunDetail(this.selectedRunId);
          }
        },

        renderSkill(s) {
          if (!s) return '';
          const name = s.tool_name || '?';
          const args = [];
          for (const k of ['target_x', 'target_y', 'target_player_id', 'target_zone', 'pass_type', 'urgency', 'opponent_id', 'entity_id', 'audience']) {
            if (s[k] !== undefined && s[k] !== null) {
              const v = (typeof s[k] === 'number') ? s[k].toFixed(2) : s[k];
              args.push(`${k}=${v}`);
            }
          }
          if (s.message) args.push(`msg=${JSON.stringify(s.message)}`);
          return `${name}(${args.join(', ')})`;
        },

        jerseyOf(slot) {
          const l = this.agentLabels[slot];
          if (!l) return slot;
          const m = l.match(/#(\d+)/);
          return m ? m[1] : slot;
        },
        posOf(slot) {
          const l = this.agentLabels[slot];
          if (!l) return '';
          const m = l.match(/\((\w+)\)/);
          return m ? m[1] : '';
        },
        labelColor(label) {
          if (!label) return 'text-zinc-400';
          if (label.startsWith('蓝')) return 'text-blue-400';
          if (label.startsWith('红')) return 'text-red-400';
          return 'text-zinc-500';
        },
        labelShort(label) {
          if (!label) return '?';
          const jersey = label.match(/#(\d+)/)?.[1];
          const pos = label.match(/\((\w+)\)/)?.[1];
          if (jersey && pos) return `#${jersey} ${pos}`;
          if (jersey) return `#${jersey}`;
          return label.slice(0, 8);
        },

        async openNewRun() {
          this.newRunModalOpen = true;
          // Load (or refresh) the lineup template every time the modal opens
          // so a scenario change is reflected.
          await this.loadLineupTemplate();
        },

        async loadLineupTemplate() {
          this.lineupLoading = true;
          try {
            const r = await fetch(`/api/lineup_template?scenario=${encodeURIComponent(this.newRun.scenario)}`);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const data = await r.json();
            // Initialize each slot's textarea with its default text.
            this.lineupEntries = [...(data.blue || []), ...(data.red || [])].map(e => ({
              ...e,
              soul: e.default || '',
            }));
          } catch (e) {
            console.error('lineup template load failed:', e);
            this.lineupEntries = [];
          } finally {
            this.lineupLoading = false;
          }
        },

        applyFifaAll() {
          for (const e of this.lineupEntries) {
            if (e.fifa) e.soul = e.fifa;
          }
        },

        resetAllLineup() {
          for (const e of this.lineupEntries) {
            e.soul = e.default;
          }
        },

        resetSlot(slot) {
          const e = this.lineupEntries.find(x => x.slot === slot);
          if (e) e.soul = e.default;
        },

        async submitRun() {
          this.creating = true;
          try {
            // Only POST overrides for slots that DIFFER from the default text.
            const overrides = this.lineupEntries
              .filter(e => (e.soul || '').trim() !== (e.default || '').trim())
              .map(e => ({ slot: e.slot, soul: (e.soul || '').trim() }));
            const payload = { ...this.newRun, lineup_overrides: overrides };
            const r = await fetch('/api/runs', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await r.json();
            this.newRunModalOpen = false;
            await this.refreshRuns();
            await this.selectRun(data.run_id);
          } catch (e) {
            alert('Failed: ' + e.message);
          } finally {
            this.creating = false;
          }
        },
      };
    }
  </script>

  <!-- ══════════════════════════════════════════════════════════════════
       Three.js free-camera 3D pitch viewer
       Coordinate mapping:  gfootball x∈[-1,1] → Three x∈[-52.5,52.5]
                            gfootball y∈[-0.42,0.42] → Three z∈[-34,34]
                            gfootball ball.z → Three y (height)
       ══════════════════════════════════════════════════════════════════ -->
  <script>
  const ThreeViewer = (() => {
    const SX = 52.5, SZ = 34;   // scale factors (half-field metres)
    let renderer, scene, camera, controls, raf;
    let pBlue = [], pRed = [], ball, resizeObs;
    let _followBall = false;

    // ── helpers ──────────────────────────────────────────────────────
    function gfToWorld(gfx, gfy) { return [gfx * SX, gfy * SZ]; }

    function makePlayer(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.35, 1.1, 4, 8),
        new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05 })
      );
      body.position.y = 0.9; body.castShadow = true;
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xd9a87a, roughness: 0.75 })
      );
      head.position.y = 1.85; head.castShadow = true;
      g.add(body, head);
      return g;
    }

    // ── Posts (cylinders only — net is built separately by makeModernGoalNet) ──
    function makePosts(x) {
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0.1 });
      const post = () => new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.44, 12), mat);
      const lp = post(); lp.position.set(x, 1.22, -3.66); lp.castShadow = true; scene.add(lp);
      const rp = post(); rp.position.set(x, 1.22,  3.66); rp.castShadow = true; scene.add(rp);
      const cb = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 7.44, 12), mat);
      cb.rotation.x = Math.PI / 2; cb.position.set(x, 2.44, 0); cb.castShadow = true; scene.add(cb);
    }

    // ─────────────────────────────────────────────────────────────────
    // Procedural grass — Canvas-generated albedo + normal + roughness
    // 1024² source, value-noise + fbm, mowing stripes, IBL-friendly PBR
    // ─────────────────────────────────────────────────────────────────
    function makeProceduralGrass() {
      const SIZE = 1024, FIELD_X = 105, FIELD_Z = 68, STRIPES = 9;
      const hash = (x, y, s) => { const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return n - Math.floor(n); };
      const lerp = (a, b, t) => a + (b - a) * t;
      const smooth = t => t * t * (3 - 2 * t);
      const valueNoise = (x, y, s) => {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const u = smooth(xf), v = smooth(yf);
        const a = hash(xi, yi, s), b = hash(xi + 1, yi, s);
        const c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
        return lerp(lerp(a, b, u), lerp(c, d, u), v);
      };
      const fbm = (x, y, s) => {
        let v = 0, amp = 0.5, freq = 1;
        for (let i = 0; i < 3; i++) { v += amp * valueNoise(x * freq, y * freq, s + i * 13.3); amp *= 0.5; freq *= 2; }
        return v;
      };

      const stripeA = { r: 60, g: 132, b: 56 };
      const stripeB = { r: 38, g: 96, b: 42 };

      // Albedo
      const albedo = document.createElement('canvas');
      albedo.width = albedo.height = SIZE;
      const aCtx = albedo.getContext('2d');
      const aImg = aCtx.createImageData(SIZE, SIZE);
      for (let y = 0; y < SIZE; y++) {
        const stripeIdx = Math.floor((y / SIZE) * STRIPES);
        const baseStripe = (stripeIdx & 1) === 0 ? stripeA : stripeB;
        const stripeF = (y / SIZE) * STRIPES - stripeIdx;
        const edgeBlend = Math.min(stripeF, 1 - stripeF) * 2;
        const edgeMix = Math.min(1, edgeBlend * 4);
        for (let x = 0; x < SIZE; x++) {
          const cross = 0.5 + 0.5 * Math.sin((x / SIZE) * Math.PI * 2 * (STRIPES * 1.7));
          const crossMod = 1 + (cross - 0.5) * 0.06;
          const nx = x / SIZE * 220, ny = y / SIZE * 220;
          const blade = fbm(nx, ny, 1.0);
          const fine  = valueNoise(nx * 3.7, ny * 3.7, 9.0);
          const otherStripe = baseStripe === stripeA ? stripeB : stripeA;
          const mixT = (1 - edgeMix) * 0.5;
          let r = baseStripe.r * (1 - mixT) + otherStripe.r * mixT;
          let g = baseStripe.g * (1 - mixT) + otherStripe.g * mixT;
          let b = baseStripe.b * (1 - mixT) + otherStripe.b * mixT;
          const lum = crossMod * (0.85 + blade * 0.30) * (0.93 + fine * 0.14);
          r *= lum; g *= lum * 1.02; b *= lum * 0.95;
          if (fine > 0.78 && blade > 0.55) {
            const dry = (fine - 0.78) / 0.22;
            r += dry * 35; g += dry * 22; b -= dry * 10;
          }
          const idx = (y * SIZE + x) * 4;
          aImg.data[idx] = Math.max(0, Math.min(255, r));
          aImg.data[idx + 1] = Math.max(0, Math.min(255, g));
          aImg.data[idx + 2] = Math.max(0, Math.min(255, b));
          aImg.data[idx + 3] = 255;
        }
      }
      aCtx.putImageData(aImg, 0, 0);

      // Normal (from height field)
      const NRM = 512;
      const heights = new Float32Array(NRM * NRM);
      for (let y = 0; y < NRM; y++) for (let x = 0; x < NRM; x++) {
        const nx = x / NRM * 220, ny = y / NRM * 220;
        heights[y * NRM + x] = 0.7 * fbm(nx, ny, 1.0) + 0.3 * valueNoise(nx * 4, ny * 4, 9.0);
      }
      const normal = document.createElement('canvas');
      normal.width = normal.height = NRM;
      const nCtx = normal.getContext('2d');
      const nImg = nCtx.createImageData(NRM, NRM);
      const STR = 2.2;
      for (let y = 0; y < NRM; y++) for (let x = 0; x < NRM; x++) {
        const xl = (x - 1 + NRM) % NRM, xr = (x + 1) % NRM;
        const yu = (y - 1 + NRM) % NRM, yd = (y + 1) % NRM;
        const dx = (heights[y * NRM + xr] - heights[y * NRM + xl]) * STR;
        const dy = (heights[yd * NRM + x] - heights[yu * NRM + x]) * STR;
        const len = Math.sqrt(dx * dx + dy * dy + 1);
        const idx = (y * NRM + x) * 4;
        nImg.data[idx]     = ((-dx / len) * 0.5 + 0.5) * 255;
        nImg.data[idx + 1] = ((-dy / len) * 0.5 + 0.5) * 255;
        nImg.data[idx + 2] = ((1 / len) * 0.5 + 0.5) * 255;
        nImg.data[idx + 3] = 255;
      }
      nCtx.putImageData(nImg, 0, 0);

      // Roughness (subtle variation)
      const ROU = 256;
      const rough = document.createElement('canvas');
      rough.width = rough.height = ROU;
      const rCtx = rough.getContext('2d');
      const rImg = rCtx.createImageData(ROU, ROU);
      for (let y = 0; y < ROU; y++) for (let x = 0; x < ROU; x++) {
        const v = fbm(x / ROU * 220, y / ROU * 220, 5.0);
        const stripeIdx = Math.floor((y / ROU) * STRIPES);
        const stripeBias = (stripeIdx & 1) === 0 ? -0.05 : 0.05;
        const rv = Math.max(0.55, Math.min(0.95, 0.78 + (v - 0.5) * 0.25 + stripeBias)) * 255;
        const idx = (y * ROU + x) * 4;
        rImg.data[idx] = rImg.data[idx + 1] = rImg.data[idx + 2] = rv;
        rImg.data[idx + 3] = 255;
      }
      rCtx.putImageData(rImg, 0, 0);

      const aTex = new THREE.CanvasTexture(albedo);
      const nTex = new THREE.CanvasTexture(normal);
      const rTex = new THREE.CanvasTexture(rough);
      const REPEAT_X = 6, REPEAT_Z = REPEAT_X * (FIELD_Z / FIELD_X);
      for (const t of [aTex, nTex, rTex]) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(REPEAT_X, REPEAT_Z);
        t.anisotropy = 8;
      }
      aTex.encoding = THREE.sRGBEncoding;     // r148 API (colour)
      nTex.encoding = THREE.LinearEncoding;
      rTex.encoding = THREE.LinearEncoding;

      const geom = new THREE.PlaneGeometry(FIELD_X, FIELD_Z, 1, 1);
      geom.rotateX(-Math.PI / 2);
      const mat = new THREE.MeshStandardMaterial({
        map: aTex,
        normalMap: nTex,
        normalScale: new THREE.Vector2(0.6, 0.6),
        roughnessMap: rTex,
        roughness: 1.0,
        metalness: 0.0,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.receiveShadow = true;
      return mesh;
    }

    // ─────────────────────────────────────────────────────────────────
    // Sky shader sphere — cinematic dusk gradient + IBL via PMREM
    // ─────────────────────────────────────────────────────────────────
    function setupSkyAndEnvironment() {
      const skyGeom = new THREE.SphereGeometry(1, 48, 24);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uZenith:  { value: new THREE.Color(0x1a1d3a) },
          uMid:     { value: new THREE.Color(0x6b3a6e) },
          uHorizon: { value: new THREE.Color(0xff8a3d) },
          uBand:    { value: new THREE.Color(0xc8b25a) },
          uGround:  { value: new THREE.Color(0x0e0a08) },
        },
        vertexShader: `
          varying vec3 vDir;
          void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          varying vec3 vDir;
          uniform vec3 uZenith, uMid, uHorizon, uBand, uGround;
          void main() {
            float h = vDir.y;
            float tBand = smoothstep(0.02, 0.12, h) * (1.0 - smoothstep(0.05, 0.2, h));
            float tMid  = smoothstep(0.1,  0.45, h);
            float tZen  = smoothstep(0.4,  0.95, h);
            vec3 col = uHorizon;
            col = mix(col, uMid,    tMid);
            col = mix(col, uZenith, tZen);
            col += uBand * tBand * 0.5;
            if (h < 0.0) {
              float k = smoothstep(0.0, -0.25, h);
              col = mix(uHorizon * 0.6, uGround, k);
            }
            gl_FragColor = vec4(col, 1.0);
          }`,
      });
      const skyMesh = new THREE.Mesh(skyGeom, skyMat);
      skyMesh.scale.setScalar(450);
      skyMesh.frustumCulled = false;
      skyMesh.renderOrder = -1;       // draw before everything else
      scene.add(skyMesh);

      // Bake to PMREM for IBL — feed an isolated scene so we don't capture pitch/lights.
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      const envScene = new THREE.Scene();
      const envSky = skyMesh.clone();
      envSky.material = skyMat;       // share material (uniforms)
      envScene.add(envSky);
      const envRT = pmrem.fromScene(envScene, 0.04);
      scene.environment = envRT.texture;
      pmrem.dispose();

      scene.fog = null;               // fog fights the warm horizon
    }

    // ─────────────────────────────────────────────────────────────────
    // Lighting — hemisphere + low warm sun (dusk), tight shadow camera
    // ─────────────────────────────────────────────────────────────────
    function setupLighting() {
      const hemi = new THREE.HemisphereLight(0x6a5a8a, 0x2a3a22, 0.55);
      hemi.position.set(0, 1, 0); scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xffe2b8, 2.4);
      sun.position.set(60, 80, 35);
      sun.target.position.set(0, 0, 0); scene.add(sun.target);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      const halfX = 105 / 2 + 4, halfZ = 68 / 2 + 4;
      sun.shadow.camera.left = -halfX; sun.shadow.camera.right = halfX;
      sun.shadow.camera.top  =  halfZ; sun.shadow.camera.bottom = -halfZ;
      sun.shadow.camera.near = 1;      sun.shadow.camera.far    = 250;
      sun.shadow.bias       = -0.0002;
      sun.shadow.normalBias = 0.05;
      sun.shadow.radius     = 2;
      scene.add(sun);
      return sun;
    }

    // ─────────────────────────────────────────────────────────────────
    // Modern goal net — alpha-tested diamond-weave on curved panels
    // ─────────────────────────────────────────────────────────────────
    let _NET_TEX = null;
    function getNetTexture() {
      if (_NET_TEX) return _NET_TEX;
      const SIZE = 512;
      const c = document.createElement('canvas');
      c.width = c.height = SIZE;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(245,245,245,0.85)';
      ctx.lineWidth = 1.6;
      const STEP = 16, DIAG = SIZE * 1.5;
      for (let i = -DIAG; i < DIAG; i += STEP) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + DIAG, DIAG); ctx.stroke(); }
      for (let i = -DIAG; i < DIAG; i += STEP) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i - DIAG, DIAG); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      for (let yy = 0; yy <= SIZE; yy += STEP) {
        for (let xx = (yy / STEP) % 2 === 0 ? 0 : STEP / 2; xx <= SIZE; xx += STEP) {
          ctx.beginPath(); ctx.arc(xx, yy, 1.1, 0, Math.PI * 2); ctx.fill();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      tex.encoding = THREE.sRGBEncoding;
      _NET_TEX = tex;
      return tex;
    }

    function makeModernGoalNet(x) {
      const group = new THREE.Group();
      const NET_TEX = getNetTexture();
      const netMat = new THREE.MeshStandardMaterial({
        map: NET_TEX, alphaMap: NET_TEX, transparent: true, alphaTest: 0.35,
        side: THREE.DoubleSide, color: 0xffffff, roughness: 0.95, metalness: 0,
        depthWrite: false,
      });
      const W = 7.32, H = 2.44, D_TOP = 1.6, D_BOT = 2.2;
      const dirSign = Math.sign(x);
      const xLine = x;
      const xBackTop = xLine + dirSign * D_TOP;
      const xBackBot = xLine + dirSign * D_BOT;

      function makePanel(a, b, c, d, repeatU, repeatV, sagAxis, sagAmount) {
        const SEG = 16;
        const geom = new THREE.PlaneGeometry(1, 1, SEG, SEG);
        const pos = geom.attributes.position;
        const uv  = geom.attributes.uv;
        for (let i = 0; i < pos.count; i++) {
          const u = pos.getX(i) + 0.5;
          const v = pos.getY(i) + 0.5;
          const topX = a.x + (b.x - a.x) * u, topY = a.y + (b.y - a.y) * u, topZ = a.z + (b.z - a.z) * u;
          const botX = d.x + (c.x - d.x) * u, botY = d.y + (c.y - d.y) * u, botZ = d.z + (c.z - d.z) * u;
          let X = botX + (topX - botX) * v;
          let Y = botY + (topY - botY) * v;
          let Z = botZ + (topZ - botZ) * v;
          const bow = 4 * u * (1 - u) * v * (1 - v);
          if (sagAxis === 'y') Y -= sagAmount * bow;
          else if (sagAxis === 'x') X += -dirSign * sagAmount * bow;
          else if (sagAxis === 'z') Z += sagAmount * bow;
          pos.setXYZ(i, X, Y, Z);
          uv.setXY(i, u * repeatU, v * repeatV);
        }
        pos.needsUpdate = true; uv.needsUpdate = true;
        geom.computeVertexNormals();
        const m = new THREE.Mesh(geom, netMat);
        m.receiveShadow = true;
        return m;
      }

      const zR = +W / 2, zL = -W / 2;
      const backTL = new THREE.Vector3(xBackTop, H, zL);
      const backTR = new THREE.Vector3(xBackTop, H, zR);
      const backBR = new THREE.Vector3(xBackBot, 0, zR);
      const backBL = new THREE.Vector3(xBackBot, 0, zL);
      group.add(makePanel(backTL, backTR, backBR, backBL, 14, 5, 'x', 0.18));

      const roofFL = new THREE.Vector3(xLine, H, zL);
      const roofFR = new THREE.Vector3(xLine, H, zR);
      const roofBR = new THREE.Vector3(xBackTop, H, zR);
      const roofBL = new THREE.Vector3(xBackTop, H, zL);
      group.add(makePanel(roofFL, roofFR, roofBR, roofBL, 14, 3, 'y', 0.12));

      const sLFT = new THREE.Vector3(xLine, H, zL);
      const sLBT = new THREE.Vector3(xBackTop, H, zL);
      const sLBB = new THREE.Vector3(xBackBot, 0, zL);
      const sLFB = new THREE.Vector3(xLine, 0, zL);
      group.add(makePanel(sLFT, sLBT, sLBB, sLFB, 4, 5, 'z', 0.08));

      const sRFT = new THREE.Vector3(xLine, H, zR);
      const sRBT = new THREE.Vector3(xBackTop, H, zR);
      const sRBB = new THREE.Vector3(xBackBot, 0, zR);
      const sRFB = new THREE.Vector3(xLine, 0, zR);
      group.add(makePanel(sRFT, sRBT, sRBB, sRFB, 4, 5, 'z', -0.08));

      return group;
    }

    // ─────────────────────────────────────────────────────────────────
    // Modern ball — Telstar-style 12 black pentagons via equirectangular Canvas
    // ─────────────────────────────────────────────────────────────────
    function makeModernBall() {
      const SIZE = 512;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE * 2; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f4f2ed';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(180,180,170,0.18)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 60; i++) {
        ctx.beginPath();
        const y = Math.random() * canvas.height;
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(canvas.width * 0.33, y + (Math.random() - 0.5) * 30,
                          canvas.width * 0.66, y + (Math.random() - 0.5) * 30,
                          canvas.width, y + (Math.random() - 0.5) * 30);
        ctx.stroke();
      }
      const t = (1 + Math.sqrt(5)) / 2;
      const verts = [
        [-1, t, 0],[1, t, 0],[-1, -t, 0],[1, -t, 0],
        [0, -1, t],[0, 1, t],[0, -1, -t],[0, 1, -t],
        [t, 0, -1],[t, 0, 1],[-t, 0, -1],[-t, 0, 1],
      ].map(v => { const L = Math.hypot(v[0], v[1], v[2]); return [v[0]/L, v[1]/L, v[2]/L]; });

      const dirToUV = d => {
        const lon = Math.atan2(d[2], d[0]), lat = Math.asin(d[1]);
        const u = (lon + Math.PI) / (2 * Math.PI);
        const v = 1 - (lat + Math.PI / 2) / Math.PI;
        return [u * canvas.width, v * canvas.height];
      };
      const drawPent = (cx, cy, r, rot) => {
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const ang = rot + (k / 5) * Math.PI * 2 - Math.PI / 2;
          const px = cx + Math.cos(ang) * r;
          const py = cy + Math.sin(ang) * r;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = '#0e0e0e'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
      };
      const BASE_R = SIZE * 0.085;
      for (const v of verts) {
        const [px, py] = dirToUV(v);
        const lat = Math.asin(v[1]);
        const stretch = 1 / Math.max(0.35, Math.cos(lat));
        const rot = (v[0] + v[1] + v[2]) * 1.7;
        for (const dx of [0, canvas.width, -canvas.width]) {
          ctx.save();
          ctx.translate(px + dx, py);
          ctx.scale(stretch, 1);
          drawPent(0, 0, BASE_R, rot);
          ctx.restore();
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = 8;

      const RAD = 0.22;
      const geom = new THREE.SphereGeometry(RAD, 48, 32);
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.55,
        metalness: 0.05,
        envMapIntensity: 0.9,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      return mesh;
    }

    function buildLines() {
      const pts = [];
      const L = (x1,z1,x2,z2) => { pts.push(new THREE.Vector3(x1,0.02,z1), new THREE.Vector3(x2,0.02,z2)); };
      L(-52.5,-34, 52.5,-34); L(52.5,-34, 52.5,34); L(52.5,34,-52.5,34); L(-52.5,34,-52.5,-34);
      L(0,-34,0,34);
      // penalty boxes
      L(-52.5,-20.15,-36.5,-20.15); L(-36.5,-20.15,-36.5,20.15); L(-36.5,20.15,-52.5,20.15);
      L( 52.5,-20.15, 36.5,-20.15); L( 36.5,-20.15, 36.5,20.15); L( 36.5,20.15, 52.5,20.15);
      // goal areas
      L(-52.5,-9.16,-46.5,-9.16); L(-46.5,-9.16,-46.5,9.16); L(-46.5,9.16,-52.5,9.16);
      L( 52.5,-9.16, 46.5,-9.16); L( 46.5,-9.16, 46.5,9.16); L( 46.5,9.16, 52.5,9.16);
      const mat = new THREE.LineBasicMaterial({ color:0xffffff, opacity:0.75, transparent:true });
      scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), mat));
      // centre circle
      const cpts = [];
      for (let i=0; i<=64; i++) { const a=i/64*Math.PI*2; cpts.push(new THREE.Vector3(Math.cos(a)*9.15,0.02,Math.sin(a)*9.15)); }
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cpts), mat));
      // corner arcs
      const corners = [[-52.5,-34,1,1],[52.5,-34,-1,1],[52.5,34,-1,-1],[-52.5,34,1,-1]];
      corners.forEach(([cx,cz,sx,sz]) => {
        const apts = [];
        for (let i=0; i<=12; i++) { const a=i/12*Math.PI/2; apts.push(new THREE.Vector3(cx+sx*Math.cos(a)*2, 0.02, cz+sz*Math.sin(a)*2)); }
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(apts), mat));
      });
    }

    // ── public API ───────────────────────────────────────────────────
    function init(canvas) {
      if (renderer) { resize(); return; }

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;          // r148 sRGB output
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      scene = new THREE.Scene();
      // background is the sky-shader sphere added in setupSkyAndEnvironment.
      // The horizon colour at the very base of the gradient peeks through if anything misses.

      camera = new THREE.PerspectiveCamera(55, 16/9, 0.5, 1000);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.07;
      controls.minDistance = 8; controls.maxDistance = 200;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;

      // Sky + IBL FIRST — environment map needs to exist before materials sample it.
      setupSkyAndEnvironment();
      // Sun + hemisphere (replaces the 4 corner spotlights).
      setupLighting();

      // Pitch grass — procedural canvas-textured PBR plane.
      scene.add(makeProceduralGrass());

      // White lines + posts.
      buildLines();
      makePosts(-52.5); makePosts(52.5);
      // Modern goal nets (woven panels, sagged inward).
      scene.add(makeModernGoalNet(-52.5));
      scene.add(makeModernGoalNet(52.5));

      // Players.
      for (let i = 0; i < 5; i++) {
        const b = makePlayer(0x2563eb); pBlue.push(b); scene.add(b);
        const r = makePlayer(0xdc2626); pRed.push(r);  scene.add(r);
      }

      // Modern ball (Telstar-style pattern).
      ball = makeModernBall();
      scene.add(ball);

      setCameraPreset('broadcast');

      resizeObs = new ResizeObserver(resize);
      resizeObs.observe(canvas.parentElement);
      resize();

      (function loop() { raf = requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
    }

    function updateFromTick(tick) {
      if (!renderer || !tick) return;
      if (tick.ball) {
        const [wx,wz] = gfToWorld(tick.ball[0], tick.ball[1]);
        const wy = tick.ball.length > 2 ? Math.max(0.22, tick.ball[2]*10+0.22) : 0.22;
        ball.position.set(wx, wy, wz);
      }
      (tick.left_team  || []).forEach((p,i) => { if (pBlue[i]) { const [wx,wz]=gfToWorld(p[0],p[1]); pBlue[i].position.set(wx,0,wz); } });
      (tick.right_team || []).forEach((p,i) => { if (pRed[i])  { const [wx,wz]=gfToWorld(p[0],p[1]); pRed[i].position.set(wx,0,wz);  } });
      if (_followBall && ball && controls) {
        controls.target.set(ball.position.x, 0, ball.position.z);
        camera.position.set(ball.position.x, 22, ball.position.z + 20);
      }
    }

    function setCameraPreset(preset) {
      if (!camera) return;
      _followBall = false;
      if (controls) controls.target.set(0, 0, 0);
      if      (preset === 'broadcast') { camera.position.set(0, 38, 50); }
      else if (preset === 'top')       { camera.position.set(0, 90, 0.1); }
      else if (preset === 'side')      { camera.position.set(0, 28, 60); }
      else if (preset === 'follow')    { _followBall = true; }
      if (controls) controls.update();
    }

    function resize() {
      if (!renderer || !camera) return;
      const el = renderer.domElement.parentElement;
      if (!el) return;
      const w = el.clientWidth, h = el.clientHeight || Math.round(w*9/16);
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }

    return { init, updateFromTick, setCameraPreset };
  })();
  </script>
