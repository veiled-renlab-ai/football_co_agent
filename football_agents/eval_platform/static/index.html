<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8" />
  <title>Academy · 5v5 Eval</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #09090b;
      --bg-1: #18181b;
      --bg-2: #27272a;
      --border: #3f3f46;
      --text-0: #fafafa;
      --text-1: #a1a1aa;
      --text-2: #71717a;
      --accent: #818cf8;
      --accent-strong: #6366f1;
      --blue: #60a5fa;
      --red: #f87171;
      --green: #4ade80;
      --yellow: #facc15;
    }
    html, body { background: var(--bg-0); color: var(--text-0); font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; }
    .card-hover:hover { background: var(--bg-2); }
    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
    .pill-running { background: rgba(99, 102, 241, 0.18); color: #c7d2fe; }
    .pill-completed { background: rgba(74, 222, 128, 0.16); color: #86efac; }
    .pill-failed { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
    .pill-queued { background: rgba(161, 161, 170, 0.16); color: #d4d4d8; }
    .gradient-text { background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    .scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
    .scrollbar::-webkit-scrollbar-track { background: transparent; }
    .glow { box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.4), 0 0 30px rgba(99, 102, 241, 0.15); }
    .pulse-dot { animation: pulse-dot 1.4s ease-in-out infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .feed-row { animation: slide-in 0.25s ease-out; }
    @keyframes slide-in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .scoreboard { background: linear-gradient(105deg, rgba(59,130,246,0.1) 0%, transparent 38%, transparent 62%, rgba(239,68,68,0.1) 100%); border: 1px solid rgba(99,102,241,0.22); }
    .score-num { text-shadow: 0 0 28px currentColor, 0 0 56px currentColor; letter-spacing: -0.02em; }
    .pitch-outer { background: #0a3318; }
  </style>
</head>
<body class="min-h-screen" x-data="academyApp()" x-init="boot()">

  <!-- Top bar -->
  <header class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur sticky top-0 z-40">
    <div class="px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-fuchsia-500 flex items-center justify-center font-bold text-sm">A</div>
        <div>
          <div class="text-lg font-semibold tracking-tight gradient-text">ACADEMY</div>
          <div class="text-xs text-zinc-500 -mt-0.5">11v11 LLM agent eval</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="text-xs text-zinc-500 mono" x-text="`${runs.length} runs`"></div>
        <button @click="openNewRun()"
                class="px-3.5 py-1.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-500 transition-colors rounded-lg flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          New Run
        </button>
      </div>
    </div>
  </header>

  <main class="flex" style="height: calc(100vh - 57px);">

    <!-- Left sidebar: run list -->
    <aside class="w-72 border-r border-zinc-800 overflow-y-auto scrollbar bg-zinc-950">
      <div class="p-3 sticky top-0 bg-zinc-950 border-b border-zinc-800">
        <div class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider px-1">Runs</div>
      </div>
      <template x-if="runs.length === 0">
        <div class="px-4 py-12 text-center text-sm text-zinc-600">
          <div class="text-3xl mb-2 opacity-40">∅</div>
          No runs yet — kick one off.
        </div>
      </template>
      <ul class="px-2 py-2 space-y-1">
        <template x-for="r in runs" :key="r.run_id">
          <li>
            <button @click="selectRun(r.run_id)"
                    class="w-full text-left px-3 py-2.5 rounded-lg card-hover transition"
                    :class="selectedRunId === r.run_id ? 'bg-zinc-800 ring-1 ring-indigo-500/50' : 'bg-transparent'">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-medium text-zinc-300 mono" x-text="r.run_id.split('-').slice(0, 2).join('-')"></span>
                <span class="pill" :class="`pill-${r.status}`">
                  <span x-show="r.status === 'running'" class="w-1.5 h-1.5 rounded-full bg-indigo-400 pulse-dot"></span>
                  <span x-text="r.status"></span>
                </span>
              </div>
              <div class="text-[11px] text-zinc-500 flex items-center justify-between">
                <span x-text="`${r.completed_episodes}/${r.n_episodes} ep · ${r.scenario}`"></span>
                <span class="mono"
                      x-show="r.aggregate && (r.aggregate.blue_wins !== undefined)"
                      x-text="`${r.aggregate.blue_wins}-${r.aggregate.draws}-${r.aggregate.red_wins}`"></span>
              </div>
            </button>
          </li>
        </template>
      </ul>
    </aside>

    <!-- Main content -->
    <section class="flex-1 overflow-y-auto scrollbar">

      <!-- Empty state -->
      <template x-if="!selectedRunId">
        <div class="h-full flex items-center justify-center">
          <div class="text-center max-w-md px-6">
            <div class="text-6xl mb-4 opacity-30">⚽</div>
            <h2 class="text-2xl font-bold mb-2 gradient-text">Welcome to Academy</h2>
            <p class="text-zinc-400 text-sm mb-6">无头模式跑 5v5 评测,实时看每个 agent 的决策、延迟、技能分布。点 <span class="text-indigo-400 font-medium">New Run</span> 启动一局。</p>
            <div class="grid grid-cols-3 gap-3 text-xs">
              <div class="card p-3"><div class="text-2xl mb-1 opacity-50">⚡</div><div class="text-zinc-300 font-medium">实时</div><div class="text-zinc-500 mt-1">WebSocket 推送决策</div></div>
              <div class="card p-3"><div class="text-2xl mb-1 opacity-50">📊</div><div class="text-zinc-300 font-medium">指标</div><div class="text-zinc-500 mt-1">延迟/技能/fallback</div></div>
              <div class="card p-3"><div class="text-2xl mb-1 opacity-50">💾</div><div class="text-zinc-300 font-medium">持久化</div><div class="text-zinc-500 mt-1">eval_runs/ JSON</div></div>
            </div>
          </div>
        </div>
      </template>

      <!-- Run detail -->
      <template x-if="selectedRunId && runDetail">
        <div class="px-6 py-6">

          <!-- Header card -->
          <div class="card glow p-5 mb-5">

            <!-- Run meta row -->
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-xs text-zinc-600 mono truncate" x-text="runDetail.run_id"></span>
                <span class="text-zinc-700 shrink-0">·</span>
                <span class="text-xs font-medium text-zinc-400 truncate" x-text="runDetail.config.scenario"></span>
              </div>
              <span class="pill shrink-0 ml-3" :class="`pill-${runDetail.status}`">
                <span x-show="runDetail.status === 'running'" class="w-1.5 h-1.5 rounded-full bg-indigo-400 pulse-dot"></span>
                <span x-text="runDetail.status"></span>
              </span>
            </div>

            <!-- Fantasy scoreboard -->
            <div class="scoreboard rounded-2xl overflow-hidden mb-5">
              <div class="flex items-center px-6 py-5">

                <!-- Blue team badge -->
                <div class="flex-1 flex items-center gap-3 min-w-0">
                  <div class="w-12 h-12 rounded-xl shrink-0 flex items-center justify-center font-black text-xl text-blue-200"
                       style="background:rgba(59,130,246,0.18);border:1px solid rgba(59,130,246,0.45);text-shadow:0 0 14px rgba(96,165,250,0.9)">蓝</div>
                  <div class="min-w-0">
                    <div class="text-sm font-bold tracking-widest text-blue-400 uppercase">Blue</div>
                    <div class="text-[11px] text-zinc-600 mt-0.5">← 左向右进攻</div>
                  </div>
                </div>

                <!-- Score + clock center -->
                <div class="flex flex-col items-center gap-1.5 px-6 shrink-0">
                  <div class="flex items-center gap-5">
                    <span class="score-num mono font-black leading-none tabular-nums text-blue-400"
                          style="font-size:3.4rem"
                          x-text="lastTick?.score_left ?? 0"></span>
                    <span class="text-zinc-600 font-extralight select-none" style="font-size:2rem">:</span>
                    <span class="score-num mono font-black leading-none tabular-nums text-red-400"
                          style="font-size:3.4rem"
                          x-text="lastTick?.score_right ?? 0"></span>
                  </div>
                  <!-- Game clock -->
                  <div class="flex items-center gap-1.5">
                    <span x-show="runDetail.status === 'running' && lastTick"
                          class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot shrink-0"></span>
                    <span class="mono text-sm font-bold tracking-widest"
                          :class="lastTick ? 'text-zinc-100' : 'text-zinc-600'"
                          x-text="lastTick ? formatGameClock(lastTick.env_tick) : '--:--'"></span>
                    <span class="text-[11px] text-zinc-600">/ 90:00</span>
                  </div>
                  <!-- Aggregate record -->
                  <div class="flex items-center gap-1 text-[11px] text-zinc-500">
                    <span class="mono font-bold text-blue-400" x-text="runDetail.aggregate.blue_wins ?? 0"></span>
                    <span class="text-zinc-600">W</span>
                    <span class="text-zinc-700 mx-0.5">·</span>
                    <span class="mono font-bold text-zinc-400" x-text="runDetail.aggregate.draws ?? 0"></span>
                    <span class="text-zinc-600">D</span>
                    <span class="text-zinc-700 mx-0.5">·</span>
                    <span class="mono font-bold text-red-400" x-text="runDetail.aggregate.red_wins ?? 0"></span>
                    <span class="text-zinc-600">W</span>
                    <span class="text-zinc-700 mx-1.5">│</span>
                    <span class="text-zinc-600">EP</span>
                    <span class="mono text-zinc-300 ml-0.5"
                          x-text="`${runDetail.completed_episodes}/${runDetail.n_episodes}`"></span>
                  </div>
                </div>

                <!-- Red team badge -->
                <div class="flex-1 flex items-center justify-end gap-3 min-w-0">
                  <div class="text-right min-w-0">
                    <div class="text-sm font-bold tracking-widest text-red-400 uppercase">Red</div>
                    <div class="text-[11px] text-zinc-600 mt-0.5">右向左进攻 →</div>
                  </div>
                  <div class="w-12 h-12 rounded-xl shrink-0 flex items-center justify-center font-black text-xl text-red-200"
                       style="background:rgba(239,68,68,0.18);border:1px solid rgba(239,68,68,0.45);text-shadow:0 0 14px rgba(248,113,113,0.9)">红</div>
                </div>

              </div>
              <!-- Scoreboard action bar -->
              <div class="flex items-center justify-between px-5 py-2.5 border-t"
                   style="border-color:rgba(99,102,241,0.15);background:rgba(0,0,0,0.25)">
                <div class="flex items-center gap-2 text-[11px]">
                  <span x-show="runDetail.status === 'running'" class="flex items-center gap-1.5 text-indigo-300">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 pulse-dot"></span>
                    LIVE · <span class="mono" x-text="`${liveCount} decisions`"></span>
                  </span>
                  <span x-show="runDetail.status !== 'running'" class="text-zinc-600">比赛已结束</span>
                </div>
                <button x-show="runDetail.status === 'running'"
                        @click="stopRun()" :disabled="stopping"
                        class="px-3 py-1 text-xs font-medium bg-red-950/70 hover:bg-red-800 border border-red-700/50 disabled:opacity-50 transition rounded-full flex items-center gap-1.5">
                  <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                  <span x-text="stopping ? '停止中...' : '终止比赛'"></span>
                </button>
              </div>
            </div>

            <!-- Stat tiles -->
            <div class="grid grid-cols-4 gap-3">
              <div class="card bg-zinc-900 p-3">
                <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Avg score</div>
                <div class="mono text-lg font-semibold">
                  <span class="text-blue-400" x-text="(runDetail.aggregate.avg_blue_score ?? 0).toFixed(2)"></span>
                  <span class="text-zinc-600 mx-1">:</span>
                  <span class="text-red-400" x-text="(runDetail.aggregate.avg_red_score ?? 0).toFixed(2)"></span>
                </div>
              </div>
              <div class="card bg-zinc-900 p-3">
                <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Avg decisions</div>
                <div class="mono text-lg font-semibold text-zinc-100" x-text="(runDetail.aggregate.avg_decisions ?? 0).toFixed(0)"></div>
              </div>
              <div class="card bg-zinc-900 p-3">
                <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">LLM p50 / p95</div>
                <div class="mono text-lg font-semibold text-zinc-100">
                  <span x-text="(runDetail.aggregate.llm_latency_p50 ?? 0).toFixed(2)"></span>s
                  <span class="text-zinc-600 mx-0.5">/</span>
                  <span x-text="(runDetail.aggregate.llm_latency_p95 ?? 0).toFixed(2)"></span>s
                </div>
              </div>
              <div class="card bg-zinc-900 p-3">
                <div class="text-[10px] uppercase tracking-wider text-zinc-500 mb-1">Avg wall / ep</div>
                <div class="mono text-lg font-semibold text-zinc-100" x-text="`${(runDetail.aggregate.avg_wall_seconds ?? 0).toFixed(1)}s`"></div>
              </div>
            </div>

            <div x-show="runDetail.error" class="mt-3 px-3 py-2 rounded-lg bg-red-950/40 border border-red-900/50 text-sm text-red-300">
              <div class="font-semibold mb-0.5">Error</div>
              <div class="mono text-xs" x-text="runDetail.error"></div>
            </div>
          </div>

          <!-- Kickoff-wait banner — visible only while runner is collecting first LLM decisions -->
          <div x-show="kickoffWait" x-transition.opacity
               class="card glow p-4 mb-5 border-indigo-500/40">
            <div class="flex items-center gap-3">
              <span class="w-2.5 h-2.5 rounded-full bg-indigo-400 pulse-dot shrink-0"></span>
              <div class="flex-1">
                <div class="text-sm font-semibold text-zinc-100">
                  等待 <span class="mono" x-text="kickoffWait?.total ?? 0"></span> 个 LLM 准备开球…
                  <span class="mono text-indigo-300 ml-1"
                        x-text="`(${kickoffWait?.ready ?? 0}/${kickoffWait?.total ?? 0} ready)`"></span>
                </div>
                <div class="text-[11px] text-zinc-500 mt-0.5">
                  env tick = 0,游戏未开始;最长等待
                  <span class="mono" x-text="(kickoffWait?.timeout_seconds ?? 8).toFixed(1)"></span> 秒,
                  超时后未响应的 agent 由 fallback 接管。
                </div>
              </div>
              <!-- Progress bar -->
              <div class="w-32 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-all"
                     :style="`width: ${kickoffWait?.total ? Math.round(100 * (kickoffWait.ready / kickoffWait.total)) : 0}%`"></div>
              </div>
            </div>
          </div>

          <!-- Live pitch view (top-down 2D) + optional 3D video stream -->
          <div class="card p-4 mb-5">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-semibold text-zinc-200">球场实况</h3>
                <span x-show="lastTick" class="pill pill-running">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>
                  Live
                </span>
                <!-- View toggle -->
                <div class="flex bg-zinc-900 rounded-md p-0.5 ml-2 text-[11px]">
                  <button @click="viewMode='three'"
                          :class="viewMode==='three' ? 'bg-indigo-600 text-white' : 'text-zinc-400'"
                          class="px-2 py-0.5 rounded transition">3D 自由</button>
                  <button @click="viewMode='3d'" x-show="runDetail.config?.render"
                          :class="viewMode==='3d' ? 'bg-indigo-600 text-white' : 'text-zinc-400'"
                          class="px-2 py-0.5 rounded transition">视频流</button>
                  <button @click="viewMode='2d'"
                          :class="viewMode==='2d' ? 'bg-indigo-600 text-white' : 'text-zinc-400'"
                          class="px-2 py-0.5 rounded transition">2D 俯视</button>
                </div>
              </div>
              <div class="text-xs text-zinc-400 mono" x-show="lastTick">
                <span class="text-zinc-500">tick</span>
                <span x-text="lastTick?.env_tick ?? 0"></span>
                <span class="text-zinc-600 mx-1">·</span>
                <span class="text-zinc-300" x-text="formatGameClock(lastTick?.env_tick ?? 0)"></span>
                <span class="text-zinc-500"> / 90:00</span>
                <span class="text-zinc-600 mx-1">·</span>
                <span class="text-blue-400" x-text="lastTick?.score_left ?? 0"></span>:<span class="text-red-400" x-text="lastTick?.score_right ?? 0"></span>
              </div>
            </div>
            <!-- Loading overlay: shown while gfootball env is cold-starting (~3–5s) -->
            <div x-show="runDetail.status === 'running' && !lastTick"
                 class="bg-zinc-900 rounded-lg flex items-center justify-center"
                 style="aspect-ratio: 16/9;">
              <div class="text-center">
                <div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <div class="text-sm text-zinc-300">正在启动 gfootball 环境…</div>
                <div class="text-xs text-zinc-500 mt-1">冷启动约 3–5 秒</div>
              </div>
            </div>
            <!-- 3D video stream (gfootball EGL render → MJPEG) + HUD overlay -->
            <div x-show="runDetail.config?.render && viewMode==='3d' && !!lastTick"
                 class="relative bg-black rounded-lg overflow-hidden">
              <img :src="videoStreamUrl"
                   :key="videoStreamUrl"
                   class="w-full block"
                   style="aspect-ratio: 16/9; object-fit: contain; background: #000;"
                   alt="gfootball live"
                   @error="videoError=true; viewMode='2d'"/>

              <!-- ── Broadcast HUD overlay ── -->
              <div class="absolute inset-x-0 top-0 pointer-events-none select-none">
                <!-- Team color strip at very top -->
                <div class="h-0.5" style="background:linear-gradient(90deg,rgba(59,130,246,0.95) 0%,rgba(59,130,246,0.95) 48.5%,rgba(255,255,255,0.15) 48.5%,rgba(255,255,255,0.15) 51.5%,rgba(239,68,68,0.95) 51.5%,rgba(239,68,68,0.95) 100%)"></div>

                <!-- Main score bar -->
                <div class="flex justify-center mt-2.5">
                  <div class="inline-flex items-stretch rounded-xl overflow-hidden"
                       style="background:rgba(6,6,10,0.80);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,0.08);box-shadow:0 6px 32px rgba(0,0,0,0.65),inset 0 1px 0 rgba(255,255,255,0.06)">

                    <!-- Blue side -->
                    <div class="flex items-center gap-2 pl-4 pr-3 py-2.5"
                         style="background:rgba(59,130,246,0.16)">
                      <div class="w-5 h-5 rounded flex items-center justify-center text-[10px] font-black text-blue-200"
                           style="background:rgba(59,130,246,0.45);border:1px solid rgba(96,165,250,0.5)">蓝</div>
                      <span class="text-blue-300 text-[11px] font-bold tracking-[0.18em] uppercase">BLUE</span>
                    </div>

                    <!-- Score -->
                    <div class="flex items-center gap-3 px-5 py-2"
                         style="border-left:1px solid rgba(255,255,255,0.07);border-right:1px solid rgba(255,255,255,0.07)">
                      <span class="mono font-black leading-none tabular-nums text-blue-400"
                            style="font-size:1.75rem;text-shadow:0 0 20px rgba(96,165,250,0.9)"
                            x-text="lastTick?.score_left ?? 0"></span>
                      <span class="text-zinc-600 font-extralight" style="font-size:1.1rem">:</span>
                      <span class="mono font-black leading-none tabular-nums text-red-400"
                            style="font-size:1.75rem;text-shadow:0 0 20px rgba(248,113,113,0.9)"
                            x-text="lastTick?.score_right ?? 0"></span>
                    </div>

                    <!-- Red side -->
                    <div class="flex items-center gap-2 pl-3 pr-4 py-2.5"
                         style="background:rgba(239,68,68,0.16)">
                      <span class="text-red-300 text-[11px] font-bold tracking-[0.18em] uppercase">RED</span>
                      <div class="w-5 h-5 rounded flex items-center justify-center text-[10px] font-black text-red-200"
                           style="background:rgba(239,68,68,0.45);border:1px solid rgba(248,113,113,0.5)">红</div>
                    </div>
                  </div>
                </div>

                <!-- Clock + episode pill -->
                <div class="flex justify-center mt-1.5">
                  <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full"
                       style="background:rgba(6,6,10,0.68);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.07);font-size:11px">
                    <span x-show="runDetail.status === 'running'"
                          class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot shrink-0"></span>
                    <span class="mono font-semibold tracking-widest text-zinc-200"
                          x-text="formatGameClock(lastTick?.env_tick ?? 0)"></span>
                    <span class="text-zinc-600">/</span>
                    <span class="text-zinc-500">90:00</span>
                    <span class="text-zinc-700 mx-0.5">│</span>
                    <span class="text-zinc-500">EP</span>
                    <span class="mono text-zinc-300 ml-0.5"
                          x-text="`${runDetail.completed_episodes}/${runDetail.n_episodes}`"></span>
                  </div>
                </div>
              </div>

              <div x-show="runDetail.status !== 'running'"
                   class="text-xs text-zinc-500 text-center py-2">
                比赛已结束 —— 视频流停止。切到 2D 看最终位置。
              </div>
            </div>
            <!-- Three.js 3D free-camera view -->
            <div x-show="viewMode==='three'"
                 class="relative rounded-lg overflow-hidden bg-zinc-950"
                 style="aspect-ratio:16/9">
              <canvas id="three-canvas" class="w-full h-full block" style="display:block"></canvas>
              <!-- Camera presets -->
              <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 pointer-events-auto">
                <template x-for="p in [{id:'broadcast',label:'广播'},{id:'top',label:'俯视'},{id:'side',label:'侧面'},{id:'follow',label:'跟球'}]" :key="p.id">
                  <button @click="threeSetCamera(p.id)"
                          :class="threeCam===p.id ? 'bg-indigo-600 text-white' : 'bg-zinc-800/80 text-zinc-300 hover:bg-zinc-700'"
                          class="px-2.5 py-1 rounded text-[11px] font-medium backdrop-blur transition"
                          x-text="p.label"></button>
                </template>
              </div>
              <div class="absolute top-2 right-2 text-[10px] text-zinc-500 pointer-events-none select-none">拖拽旋转 · 滚轮缩放</div>
            </div>

            <!-- 2D top-down pitch (enhanced) -->
            <div x-show="viewMode==='2d' && !!lastTick"
                 class="pitch-outer rounded-xl overflow-hidden">
              <svg viewBox="-110 -52 220 104" xmlns="http://www.w3.org/2000/svg" class="w-full block" style="aspect-ratio:220/104" preserveAspectRatio="xMidYMid meet">
                <defs>
                  <pattern id="gp" x="-100" y="-42" width="20" height="84" patternUnits="userSpaceOnUse">
                    <rect width="10" height="84" fill="#0f4d1e"/>
                    <rect x="10" width="10" height="84" fill="#0b3d17"/>
                  </pattern>
                  <filter id="glow-b" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="1.2" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                  <filter id="glow-r" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="1.2" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                  <filter id="ball-glow" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur stdDeviation="2" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                </defs>

                <!-- Grass stripes -->
                <rect x="-100" y="-42" width="200" height="84" fill="url(#gp)"/>
                <!-- Pitch outline -->
                <rect x="-100" y="-42" width="200" height="84" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.55"/>
                <!-- Halfway line -->
                <line x1="0" y1="-42" x2="0" y2="42" stroke="#22c55e" stroke-width="0.35" opacity="0.5"/>
                <!-- Center circle -->
                <circle cx="0" cy="0" r="9.15" fill="none" stroke="#22c55e" stroke-width="0.35" opacity="0.45"/>
                <!-- Center spot -->
                <circle cx="0" cy="0" r="0.6" fill="#22c55e" opacity="0.7"/>
                <!-- Penalty boxes -->
                <rect x="83" y="-20.1" width="17" height="40.2" fill="none" stroke="#22c55e" stroke-width="0.3" opacity="0.45"/>
                <rect x="-100" y="-20.1" width="17" height="40.2" fill="none" stroke="#22c55e" stroke-width="0.3" opacity="0.45"/>
                <!-- Goal areas -->
                <rect x="93.5" y="-9.3" width="6.5" height="18.6" fill="none" stroke="#22c55e" stroke-width="0.25" opacity="0.35"/>
                <rect x="-100" y="-9.3" width="6.5" height="18.6" fill="none" stroke="#22c55e" stroke-width="0.25" opacity="0.35"/>
                <!-- Penalty spots -->
                <circle cx="88" cy="0" r="0.55" fill="#22c55e" opacity="0.6"/>
                <circle cx="-88" cy="0" r="0.55" fill="#22c55e" opacity="0.6"/>
                <!-- Penalty arcs (D outside box) -->
                <path d="M 83,-16.5 A 17,17 0 0,0 83,16.5" fill="none" stroke="#22c55e" stroke-width="0.3" opacity="0.4"/>
                <path d="M -83,16.5 A 17,17 0 0,0 -83,-16.5" fill="none" stroke="#22c55e" stroke-width="0.3" opacity="0.4"/>
                <!-- Corner arcs -->
                <path d="M 98,-42 A 2,2 0 0,1 100,-40" fill="none" stroke="#22c55e" stroke-width="0.25" opacity="0.4"/>
                <path d="M 100,40 A 2,2 0 0,1 98,42" fill="none" stroke="#22c55e" stroke-width="0.25" opacity="0.4"/>
                <path d="M -100,-40 A 2,2 0 0,1 -98,-42" fill="none" stroke="#22c55e" stroke-width="0.25" opacity="0.4"/>
                <path d="M -98,42 A 2,2 0 0,1 -100,40" fill="none" stroke="#22c55e" stroke-width="0.25" opacity="0.4"/>
                <!-- Goals (net area) -->
                <rect x="100" y="-4.4" width="2.5" height="8.8" fill="rgba(253,230,138,0.08)" stroke="#fde68a" stroke-width="0.45" opacity="0.8"/>
                <rect x="-102.5" y="-4.4" width="2.5" height="8.8" fill="rgba(253,230,138,0.08)" stroke="#fde68a" stroke-width="0.45" opacity="0.8"/>

                <!-- Blue team players -->
                <template x-for="(p, i) in (lastTick?.left_team ?? [])" :key="`L${i}`">
                  <g>
                    <!-- Ball-holder golden glow ring -->
                    <circle x-show="lastTick?.ball_owned_team === 0 && lastTick?.ball_owned_player === i"
                            :cx="p[0]*100" :cy="p[1]*100" r="6"
                            fill="rgba(253,230,138,0.18)" stroke="rgba(253,230,138,0.55)" stroke-width="0.7"/>
                    <!-- Outer team ring -->
                    <circle :cx="p[0]*100" :cy="p[1]*100" r="3.6"
                            fill="rgba(59,130,246,0.28)" stroke="#60a5fa" stroke-width="0.7"/>
                    <!-- Inner body -->
                    <circle :cx="p[0]*100" :cy="p[1]*100" r="2.6" fill="#1d4ed8"/>
                    <!-- Jersey number -->
                    <text :x="p[0]*100" :y="p[1]*100 + 0.9"
                          text-anchor="middle" font-size="2.6" fill="white" font-weight="800"
                          font-family="JetBrains Mono,monospace" x-text="jerseyOf(i)"></text>
                    <!-- Position label below -->
                    <text :x="p[0]*100" :y="p[1]*100 + 6.8"
                          text-anchor="middle" font-size="2" fill="#93c5fd" font-weight="600"
                          font-family="Inter,sans-serif" x-text="posOf(i)"></text>
                  </g>
                </template>

                <!-- Red team players -->
                <template x-for="(p, i) in (lastTick?.right_team ?? [])" :key="`R${i}`">
                  <g>
                    <!-- Ball-holder golden glow ring -->
                    <circle x-show="lastTick?.ball_owned_team === 1 && lastTick?.ball_owned_player === i"
                            :cx="p[0]*100" :cy="p[1]*100" r="6"
                            fill="rgba(253,230,138,0.18)" stroke="rgba(253,230,138,0.55)" stroke-width="0.7"/>
                    <!-- Outer team ring -->
                    <circle :cx="p[0]*100" :cy="p[1]*100" r="3.6"
                            fill="rgba(239,68,68,0.28)" stroke="#f87171" stroke-width="0.7"/>
                    <!-- Inner body -->
                    <circle :cx="p[0]*100" :cy="p[1]*100" r="2.6" fill="#991b1b"/>
                    <!-- Jersey number -->
                    <text :x="p[0]*100" :y="p[1]*100 + 0.9"
                          text-anchor="middle" font-size="2.6" fill="white" font-weight="800"
                          font-family="JetBrains Mono,monospace" x-text="jerseyOf(5+i)"></text>
                    <!-- Position label below -->
                    <text :x="p[0]*100" :y="p[1]*100 + 6.8"
                          text-anchor="middle" font-size="2" fill="#fca5a5" font-weight="600"
                          font-family="Inter,sans-serif" x-text="posOf(5+i)"></text>
                  </g>
                </template>

                <!-- Ball -->
                <g x-show="lastTick" filter="url(#ball-glow)">
                  <circle :cx="(lastTick?.ball?.[0] ?? 0)*100" :cy="(lastTick?.ball?.[1] ?? 0)*100"
                          r="2" fill="#fef3c7" stroke="#92400e" stroke-width="0.45"/>
                  <circle :cx="(lastTick?.ball?.[0] ?? 0)*100" :cy="(lastTick?.ball?.[1] ?? 0)*100"
                          r="0.7" fill="rgba(120,53,15,0.5)"/>
                </g>
              </svg>

              <!-- Pitch footer legend -->
              <div class="flex items-center gap-4 px-3 py-2 text-[11px] text-zinc-500 border-t"
                   style="border-color:rgba(34,197,94,0.12);background:rgba(0,0,0,0.3)">
                <span class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full bg-blue-500 ring-1 ring-blue-400/50"></span>
                  <span class="text-blue-400">蓝队</span>
                </span>
                <span class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full bg-red-500 ring-1 ring-red-400/50"></span>
                  <span class="text-red-400">红队</span>
                </span>
                <span class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full bg-amber-100 ring-1 ring-amber-400/50"></span>
                  <span>球</span>
                </span>
                <span class="flex items-center gap-1.5 text-amber-400/70">
                  <svg class="w-3 h-3" viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                  <span>持球</span>
                </span>
                <span class="ml-auto mono text-zinc-600 tabular-nums">
                  ball <span x-text="`(${(lastTick?.ball?.[0] ?? 0).toFixed(2)}, ${(lastTick?.ball?.[1] ?? 0).toFixed(2)})`"></span>
                </span>
              </div>
            </div>
          </div>

          <!-- Episode list -->
          <div class="card p-5 mb-5">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-semibold text-zinc-200">Episodes</h3>
              <span class="text-xs text-zinc-500 mono" x-text="`${runDetail.episodes?.length ?? 0} done`"></span>
            </div>
            <div class="overflow-x-auto scrollbar">
              <table class="w-full text-sm">
                <thead>
                  <tr class="text-[10px] uppercase tracking-wider text-zinc-500 border-b border-zinc-800">
                    <th class="text-left font-medium py-2 pr-3">#</th>
                    <th class="text-left font-medium py-2 pr-3">Score</th>
                    <th class="text-left font-medium py-2 pr-3">Outcome</th>
                    <th class="text-right font-medium py-2 pr-3">Decisions</th>
                    <th class="text-right font-medium py-2 pr-3">Ticks</th>
                    <th class="text-right font-medium py-2 pr-3">Wall</th>
                    <th class="text-right font-medium py-2 pr-3">LLM p50</th>
                    <th class="text-right font-medium py-2 pr-3">Fallback/dec</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="ep in (runDetail.episodes ?? [])" :key="ep.ep_index">
                    <tr class="border-b border-zinc-900 hover:bg-zinc-900/60 transition">
                      <td class="py-2 pr-3 mono text-zinc-400" x-text="`#${ep.ep_index}`"></td>
                      <td class="py-2 pr-3 mono">
                        <span class="text-blue-400" x-text="ep.summary.score_blue"></span>
                        <span class="text-zinc-600 mx-0.5">:</span>
                        <span class="text-red-400" x-text="ep.summary.score_red"></span>
                      </td>
                      <td class="py-2 pr-3">
                        <span class="pill"
                              :class="ep.summary.outcome === 'blue_win' ? 'pill-running' : ep.summary.outcome === 'red_win' ? 'pill-failed' : 'pill-queued'"
                              x-text="ep.summary.outcome"></span>
                      </td>
                      <td class="py-2 pr-3 mono text-right text-zinc-300" x-text="ep.summary.decisions_total"></td>
                      <td class="py-2 pr-3 mono text-right text-zinc-400" x-text="ep.summary.env_ticks"></td>
                      <td class="py-2 pr-3 mono text-right text-zinc-400" x-text="`${ep.summary.wall_seconds}s`"></td>
                      <td class="py-2 pr-3 mono text-right text-zinc-300" x-text="`${ep.summary.llm_latency.p50.toFixed(2)}s`"></td>
                      <td class="py-2 pr-3 mono text-right text-zinc-400" x-text="ep.summary.fallback_per_decision.toFixed(2)"></td>
                      <td class="py-2 text-right">
                        <button @click="loadEpisode(ep.ep_index)"
                                class="text-xs text-indigo-400 hover:text-indigo-300 transition">详情 →</button>
                      </td>
                    </tr>
                  </template>
                  <template x-if="!runDetail.episodes || runDetail.episodes.length === 0">
                    <tr><td colspan="9" class="text-center text-sm text-zinc-500 py-8">还没有 episode 完成</td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Two-column: skill chart + per-agent + live feed -->
          <div class="grid grid-cols-3 gap-5 mb-5">
            <div class="card p-5 col-span-2">
              <h3 class="text-sm font-semibold text-zinc-200 mb-3">Skill distribution
                <span class="text-zinc-500 font-normal ml-1" x-text="selectedEpisodeIdx ? `· episode #${selectedEpisodeIdx}` : '· latest episode'"></span>
              </h3>
              <div class="h-72">
                <canvas id="skillChart"></canvas>
              </div>
            </div>
            <div class="card p-5">
              <h3 class="text-sm font-semibold text-zinc-200 mb-3">Live decisions</h3>
              <div class="overflow-y-auto scrollbar h-72 space-y-1 pr-1" id="liveFeed">
                <template x-for="(d, i) in liveFeed.slice(-50).reverse()" :key="`${d.episode}-${d.decision}-${i}`">
                  <div class="feed-row flex items-start gap-2 px-2 py-1.5 rounded text-xs bg-zinc-900/50 hover:bg-zinc-900">
                    <span class="mono text-zinc-600 shrink-0 w-12" x-text="`t${d.env_tick}`"></span>
                    <span class="shrink-0 font-medium" :class="labelColor(d.label)" x-text="labelShort(d.label)"></span>
                    <span class="text-zinc-300 mono" x-text="renderSkill(d.skill)"></span>
                    <span class="ml-auto text-zinc-600 mono shrink-0" x-text="`${d.llm_seconds}s`"></span>
                  </div>
                </template>
                <template x-if="liveFeed.length === 0">
                  <div class="text-zinc-600 text-xs text-center py-12">等待决策...</div>
                </template>
              </div>
            </div>
          </div>

          <!-- Per-agent breakdown -->
          <div class="card p-5" x-show="perAgentRows.length > 0">
            <h3 class="text-sm font-semibold text-zinc-200 mb-3">Per-agent breakdown
              <span class="text-zinc-500 font-normal ml-1" x-text="selectedEpisodeIdx ? `· episode #${selectedEpisodeIdx}` : '· latest episode'"></span>
            </h3>
            <div class="overflow-x-auto scrollbar">
              <table class="w-full text-sm">
                <thead>
                  <tr class="text-[10px] uppercase tracking-wider text-zinc-500 border-b border-zinc-800">
                    <th class="text-left font-medium py-2 pr-3">Agent</th>
                    <th class="text-right font-medium py-2 pr-3">Decisions</th>
                    <th class="text-right font-medium py-2 pr-3">LLM p50</th>
                    <th class="text-right font-medium py-2 pr-3">LLM p95</th>
                    <th class="text-left font-medium py-2 pr-3 pl-6">Top skills</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in perAgentRows" :key="row.slot">
                    <tr class="border-b border-zinc-900">
                      <td class="py-2 pr-3 font-medium" :class="labelColor(row.label)" x-text="row.label"></td>
                      <td class="py-2 pr-3 mono text-right text-zinc-300" x-text="row.decisions"></td>
                      <td class="py-2 pr-3 mono text-right text-zinc-300" x-text="`${row.llm_latency_p50.toFixed(2)}s`"></td>
                      <td class="py-2 pr-3 mono text-right text-zinc-400" x-text="`${row.llm_latency_p95.toFixed(2)}s`"></td>
                      <td class="py-2 pr-3 pl-6 mono text-xs text-zinc-400">
                        <template x-for="[name, count] in row.top_skills">
                          <span class="inline-block mr-2"><span class="text-indigo-400" x-text="name"></span>·<span x-text="count"></span></span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </template>
    </section>
  </main>

  <!-- New Run modal -->
  <div x-show="newRunModalOpen" x-transition.opacity
       class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
       @click.self="newRunModalOpen = false" style="display: none;">
    <div class="card w-full max-w-3xl p-6 max-h-[90vh] overflow-y-auto scrollbar" @click.stop>
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-semibold gradient-text">New eval run</h3>
        <button @click="newRunModalOpen = false" class="text-zinc-500 hover:text-zinc-200 text-xl leading-none">&times;</button>
      </div>
      <form @submit.prevent="submitRun()" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1.5">N episodes</label>
          <input type="number" min="1" max="50" x-model.number="newRun.n_episodes"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm mono focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1.5">Scenario</label>
          <input type="text" x-model="newRun.scenario"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm mono focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1.5">Max wall (s)</label>
            <input type="number" min="10" max="10800" x-model.number="newRun.max_wall_seconds"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm mono focus:outline-none focus:border-indigo-500" />
            <div class="text-[10px] text-zinc-600 mt-1">5400 = 90 分钟(整场)</div>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1.5">Wall fps (1:1)</label>
            <input type="number" min="0" max="240" x-model.number="newRun.target_wall_fps"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm mono focus:outline-none focus:border-indigo-500" />
            <div class="text-[10px] text-zinc-600 mt-1">50 = 1:1 实时;0 = 不限速</div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1.5">Obs refresh ticks</label>
            <input type="number" min="1" max="100" x-model.number="newRun.obs_refresh_every_ticks"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm mono focus:outline-none focus:border-indigo-500" />
            <div class="text-[10px] text-zinc-600 mt-1">25 = 每 0.5s 同步快照</div>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1.5">Pitch fps</label>
            <input type="number" min="1" max="50" x-model.number="newRun.tick_stream_every_ticks"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm mono focus:outline-none focus:border-indigo-500" />
            <div class="text-[10px] text-zinc-600 mt-1">5 = 每 100ms 推一帧位置</div>
          </div>
        </div>
        <div class="flex items-center gap-4 pt-1">
          <label class="flex items-center gap-2 text-sm text-zinc-300">
            <input type="checkbox" x-model="newRun.render"
                   class="w-4 h-4 rounded bg-zinc-900 border-zinc-700 text-indigo-500 focus:ring-indigo-500" />
            Render gfootball 3D 窗口
          </label>
          <label class="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer" title="暂停球场等所有 Agent 决策完再继续，彻底消除 fallback 乱跑">
            <input type="checkbox" x-model="newRun.stop_world_mode"
                   class="w-4 h-4 rounded bg-zinc-900 border-zinc-700 text-amber-400 focus:ring-amber-400" />
            <span>Stop-World 模式</span>
            <span class="text-zinc-500 text-[11px]">（决策期间暂停球场）</span>
          </label>
          <label class="flex items-center gap-2 text-sm text-zinc-400">
            <span class="text-xs uppercase tracking-wider">N episodes</span>
            <input type="number" min="1" max="50" x-model.number="newRun.n_episodes"
                   class="w-16 bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-sm mono focus:outline-none focus:border-indigo-500" />
          </label>
        </div>
        <div class="text-[11px] text-zinc-500 leading-relaxed pt-1">
          默认 = 1 局 90 分钟实时(5400s wall)。中途想停按右上"停止"按钮。
        </div>

        <!-- ─────────────────────────────────────────────────────────────
             球员灵魂注入面板 — 22 个 textarea，开始前可编辑每个球员的人设
        ───────────────────────────────────────────────────────────── -->
        <div class="border-t border-zinc-800 pt-4 mt-2">
          <div class="flex items-center justify-between gap-2">

              <svg class="w-4 h-4 transition-transform" :class="lineupExpanded ? 'rotate-90' : ''"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            默认会用每个球员的中文人设（背景 + 球风）。展开可以为任意球员注入定制灵魂，或一键应用 FIFA 名将模板。
          </p>

          <div x-show="lineupExpanded" x-transition class="mt-3 space-y-1.5 max-h-[55vh] overflow-y-auto scrollbar pr-1">
            <template x-for="entry in lineupEntries" :key="entry.slot">

                      FIFA: <span class="text-amber-300/80 italic" x-text="entry.fifa_player"></span>
                    </span>
                    <button type="button" @click="entry.soul = entry.fifa"
                            x-show="entry.fifa"
                            class="text-[10px] px-1.5 py-0.5 bg-amber-700/30 hover:bg-amber-700/50 text-amber-200 rounded transition"
                            title="只对这个球员应用 FIFA 模板">应用</button>
                    <button type="button" @click="resetSlot(entry.slot)"
                            class="text-[10px] px-1.5 py-0.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 rounded transition"
                            title="只重置这个球员">重置</button>

                <textarea x-model="entry.soul" rows="3"

            <div x-show="!lineupEntries.length && !lineupLoading"
                 class="text-xs text-zinc-500 text-center py-4">

        <div class="flex justify-end gap-2 pt-2">

                  class="px-4 py-2 text-sm text-zinc-400 hover:text-zinc-200 transition">Cancel</button>
